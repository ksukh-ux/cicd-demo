# 02-deploy.yml – Deploy-Pipeline (CD)
# Veröffentlicht den Ordner site/ auf GitHub Pages,
# aber nur, wenn vorher alle Tests grün sind.
name: Deploy

# Trigger: nur bei Push auf main (also nach einem Merge)
on:
  push:
    branches: [main]

# Rechte, die die Pipeline zum Veröffentlichen braucht
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Stufe 1: Testen (wie in ci.yml)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest

  # Stufe 2: Veröffentlichen
  deploy:
    # needs: startet erst, wenn "test" erfolgreich war
    needs: test
    runs-on: ubuntu-latest
    # NEU: gibt die Seiten-URL an nachfolgende Jobs weiter
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    # Zielumgebung mit Freigabe durch Required Reviewers
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages vorbereiten
      - uses: actions/configure-pages@v5
      # Den Ordner site/ als Paket (Artefakt) hochladen
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Das Paket veröffentlichen
      - id: deployment
        uses: actions/deploy-pages@v4

  # NEU – Stufe 3: Smoke-Test (Spitze der Testpyramide, Kapitel 3.3.1)
  # Prüft nach dem Deployment, ob die echte Seite erreichbar ist
  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Seite erreichbar und Inhalt korrekt?
        # --retry: GitHub Pages braucht nach dem Deploy manchmal einige Sekunden
        run: |
          curl --fail --silent --show-error \
               --retry 5 --retry-delay 10 --retry-all-errors \
               "${{ needs.deploy.outputs.page_url }}" | grep -q "CI/CD-Demo"


               
